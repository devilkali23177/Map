<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mind map planner</title>
<style>
:root{--bg:#eceee7;--dot:#c9cdc2;--ink:#1c2b2f;--card:#fcfcf9;--acc:#e0a526;--bar:#fcfcf9;--line:#d5d8cf}
@media (prefers-color-scheme:dark){:root{--bg:#171e20;--dot:#2b3639;--ink:#e8ece6;--card:#243033;--bar:#1f292b;--line:#33423f}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#stage{position:fixed;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:24px 24px;cursor:grab;touch-action:none}
#stage.pan{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
path{fill:none;stroke-width:2.5;stroke-linecap:round;opacity:.85}
.n{position:absolute;min-width:72px;max-width:240px;padding:8px 14px 8px 16px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px 14px 14px 6px;font:500 15px Georgia,"Iowan Old Style",serif;line-height:1.35;white-space:pre-wrap;overflow-wrap:anywhere;cursor:pointer;user-select:none;box-shadow:0 1px 0 var(--line)}
.n.root{font-size:19px;font-weight:700;padding:12px 20px 12px 18px;border-left-width:8px;background:var(--c);color:#fff;border-color:var(--c)}
.n.done{opacity:.55}.n.done .t{text-decoration:line-through}
.n.dim{opacity:.22}
.b{display:inline-flex;gap:5px;align-items:center;margin-left:8px;vertical-align:middle;font:600 11px system-ui,sans-serif;white-space:nowrap;text-decoration:none}
.b b{background:var(--line);border-radius:9px;padding:1px 7px;font-weight:600;color:var(--ink)}
.root .b b{background:rgba(255,255,255,.28);color:#fff}
.b b.late{background:#c8553d;color:#fff}
.p{width:9px;height:9px;border-radius:50%;display:inline-block}
.p1{background:#5b9d6b}.p2{background:#e0a526}.p3{background:#c8553d}
#panel{position:fixed;right:12px;bottom:44px;width:240px;display:flex;flex-direction:column;gap:8px;background:var(--bar);border:1px solid var(--line);border-radius:12px;padding:12px}
#panel[hidden]{display:none}
#panel label{display:flex;flex-direction:column;gap:3px;font-size:12px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:5px 8px}
#q{width:150px}
.n.sel{outline:2.5px solid var(--acc);outline-offset:2px}
.t[contenteditable=true]{user-select:text;cursor:text;outline:2.5px solid var(--acc);outline-offset:4px;border-radius:3px}
#bar{position:fixed;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;pointer-events:none}
#bar>*{pointer-events:auto}
.g{display:flex;gap:4px;align-items:center;background:var(--bar);border:1px solid var(--line);border-radius:10px;padding:4px}
button{font:inherit;color:var(--ink);background:transparent;border:0;border-radius:7px;padding:6px 10px;cursor:pointer}
button:hover{background:var(--line)}
button:focus-visible{outline:2px solid var(--acc)}
.sw{width:22px;height:22px;padding:0;border-radius:50%;border:2px solid var(--bar)}
.sw:hover{transform:scale(1.15);background:inherit}
#hint{position:fixed;bottom:12px;left:12px;right:270px;font-size:12.5px;opacity:.7;pointer-events:none}
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:7px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}

body.locked #stage,body.locked #bar,body.locked #panel,body.locked #hint,body.locked #notes{display:none}
body.notes #stage,body.notes #mmTools,body.notes #panel,body.notes #hint{display:none}
#mmTools{display:contents}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg)}
#notes{position:fixed;inset:0;overflow:auto;padding:84px 16px 28px;display:none}
body.notes #notes{display:block}
#notes .wrap{max-width:1120px;margin:0 auto}
#nhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
#nhead h2{margin:0;font:700 22px Georgia,"Iowan Old Style",serif}
#nhead p{margin:2px 0 0;opacity:.7;font-size:13px}
#cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:6px 14px 14px 6px;padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font:600 16px Georgia,"Iowan Old Style",serif}
.card h3 span{opacity:.55;font:600 13px system-ui,sans-serif;margin-right:8px}
.card .qq{margin:0;font-size:13px;opacity:.75}
.card textarea{width:100%;min-height:112px;resize:vertical}
.card.has{border-color:var(--c)}
#auth{display:none;position:fixed;inset:0;z-index:8;align-items:center;justify-content:center;padding:16px;background:var(--bg)}
#auth.show{display:flex}
#af{width:100%;max-width:340px;background:var(--bar);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px}
#af h1{margin:0;font:700 22px Georgia,"Iowan Old Style",serif}
#af p{margin:0;font-size:13px;opacity:.75;line-height:1.45}
#af input{width:100%;padding:9px 10px}
#aE{min-height:18px;font-size:13px;color:#c8553d}
#af .row{display:flex;gap:8px}
#af .row button{flex:1;padding:9px 10px;border:1px solid var(--line)}
#aGo{background:var(--ink);color:var(--bg)}
#aGo:disabled{opacity:.6;cursor:wait}
#aReset{font-size:12px;color:var(--ink);opacity:.7;align-self:flex-start;background:none;padding:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="locked">
<div id="auth"><form id="af">
  <h1 id="aT"></h1><p id="aP"></p>
  <input type="password" id="a1" aria-label="Password" placeholder="Password" required>
  <input type="password" id="a2" aria-label="Repeat password" placeholder="Repeat password">
  <div id="aE" role="alert"></div>
  <div class="row"><button type="button" id="aX">Cancel</button><button type="submit" id="aGo"></button></div>
  <button type="button" id="aReset">Forgot the password? Erase and start over</button>
</form></div>
<div id="stage"><div id="world"><svg id="lines"></svg></div></div>
<div id="bar">
  <div class="g" role="tablist">
    <button class="tab" id="tMap" role="tab" aria-selected="true">Mind map</button>
    <button class="tab" id="tNotes" role="tab" aria-selected="false">Planning notes</button>
  </div>
  <div class="g">
    <button id="bHtml" title="Download this page with your encrypted data inside it, ready to upload to GitHub">Save HTML</button>
    <button id="bPw">Password</button>
    <button id="bLock">Lock</button>
  </div>
  <div id="mmTools">
  <div class="g">
    <button id="bChild" title="Tab">Add child</button>
    <button id="bSib" title="Enter">Add sibling</button>
    <button id="bEdit" title="F2 or double-click">Rename</button>
    <button id="bDone" title="Space">Mark done</button>
    <button id="bDel" title="Delete">Delete</button>
    <button id="bCol" title="C">Collapse</button>
  </div>
  <div class="g" id="sws" aria-label="Branch colour"></div>
  <div class="g">
    <button id="bTidy">Tidy layout</button>
    <button id="bFit">Fit to screen</button>
  </div>
  <div class="g">
    <button id="bCopy">Copy outline</button>
    <button id="bExp" title="Download the map as a JSON backup (not encrypted)">Save file</button>
    <button id="bImp">Open file</button>
    <button id="bNew">New map</button>
  </div>
  <div class="g"><button id="bUndo" title="Ctrl+Z">Undo</button><button id="bRedo" title="Ctrl+Y">Redo</button><input id="q" type="search" placeholder="Search ideas" aria-label="Search ideas"></div>
  <input type="file" id="file" accept=".json,application/json" hidden>
  </div>
</div>
<div id="notes"><div class="wrap">
  <div id="nhead"><div><h2>Planning notes</h2><p id="ncount"></p></div><div class="g"><button id="bNCopy">Copy all notes</button></div></div>
  <div id="cards"></div>
</div></div>
<div id="panel" hidden>
  <label>Due date<input type="date" id="pDue"></label>
  <label>Priority<select id="pPri"><option value="0">None</option><option value="1">Low</option><option value="2">Medium</option><option value="3">High</option></select></label>
  <label>Notes<textarea id="pNote" rows="5" placeholder="Details, links, next steps"></textarea></label>
</div>
<div id="hint">Tab adds a child, Enter a sibling, C collapses a branch, Space marks done, Ctrl+Z undoes. Double-click renames. Drag cards to move a branch, scroll to zoom.</div>
<div id="toast"></div>
<script id="vault" type="application/json">null</script>
<script>
(function(){
var SRC="<!DOCTYPE html>\n"+document.documentElement.outerHTML;
var OLD='mindmap-planner-v1',LK='mindmap-planner-vault-v2';
var COLORS=['#2f5d62','#c8553d','#c18a0e','#5b6c9d','#8a5a8f','#6b6f68'];
var STEPS=[['Vision','What do I want to achieve?'],['Purpose','Why is it important?'],['Research','What do I need to know?'],['Brainstorming','What are all the possibilities?'],['Analysis','What are the advantages and disadvantages?'],['Strategy','What is the best approach?'],['Resources','What do I need?'],['Risk Analysis','What could go wrong?'],['Decision','Which option should I select?'],['Execution','How will I implement it?'],['Monitoring','Is everything going according to plan?'],['Review & Improvement','What can I improve next time?']];
var stage=document.getElementById('stage'),world=document.getElementById('world'),svg=document.getElementById('lines');
var S,sel,editing=false,drag=null,hist=[],hi=0,q='';
var NOTES={},CK=null,SALT=null,EMB=null,migrated=false,vt=null,amode='unlock';
try{EMB=JSON.parse(document.getElementById('vault').textContent.trim()||'null')}catch(e){}

function uid(){return 'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function fresh(){var id=uid(),o={};o[id]={id:id,text:'My plan',x:0,y:0,parent:null,color:0,done:false};
  STEPS.forEach(function(s,i){var c=uid()+i;o[c]={id:c,text:(i+1)+'. '+s[0],x:240,y:i*62,parent:id,color:(i+1)%COLORS.length,done:false,note:s[1]}});
  return{root:id,nodes:o,view:{x:Math.max(80,innerWidth/2-300),y:innerHeight/2,k:1}}}
function oldMap(){try{var t=localStorage.getItem(OLD);if(t){var d=JSON.parse(t);if(d&&d.nodes&&d.nodes[d.root])return d}}catch(e){}return null}
function localVault(){try{return JSON.parse(localStorage.getItem(LK))}catch(e){return null}}

/* encryption: password -> PBKDF2 -> AES-GCM */
var enc=new TextEncoder(),dec=new TextDecoder();
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s)}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function derive(pw,salt){return crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']).then(function(m){
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])})}
function seal(){var iv=crypto.getRandomValues(new Uint8Array(12));
  return crypto.subtle.encrypt({name:'AES-GCM',iv:iv},CK,enc.encode(JSON.stringify({map:S,notes:NOTES}))).then(function(ct){
    return{v:1,salt:b64(SALT),iv:b64(iv),data:b64(ct),ts:Date.now()}})}
function openVault(v,pw){var salt=unb64(v.salt);return derive(pw,salt).then(function(k){
  return crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(v.iv)},k,unb64(v.data)).then(function(pt){
    return{key:k,salt:salt,payload:JSON.parse(dec.decode(pt)),ts:v.ts||0}})})}
function flush(){clearTimeout(vt);if(!CK||!S)return Promise.resolve(null);
  return seal().then(function(v){
    try{localStorage.setItem(LK,JSON.stringify(v));if(migrated){localStorage.removeItem(OLD);migrated=false}}catch(e){toast('Could not save in this browser')}
    return v})}
function persist(){clearTimeout(vt);vt=setTimeout(flush,300)}
function snapStr(){return JSON.stringify({root:S.root,nodes:S.nodes})}
function snap(){var t=snapStr();if(t===hist[hi])return;hist=hist.slice(0,hi+1);hist.push(t);if(hist.length>80)hist.shift();hi=hist.length-1}
function save(){persist();snap()}
function jump(i){if(i<0||i>=hist.length)return;hi=i;var d=JSON.parse(hist[hi]);S.nodes=d.nodes;S.root=d.root;if(!S.nodes[sel])sel=S.root;render();persist()}
function undo(){jump(hi-1)}function redo(){jump(hi+1)}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.opacity=0},1800)}
function el(id){return world.querySelector('[data-id="'+id+'"]')}
function kids(id){return Object.values(S.nodes).filter(function(n){return n.parent===id})}
function subtree(id){var out=[id];kids(id).forEach(function(c){out=out.concat(subtree(c.id))});return out}

function hidden(){var h={};Object.values(S.nodes).forEach(function(n){var p=n.parent;while(p&&S.nodes[p]){if(S.nodes[p].collapsed){h[n.id]=1;break}p=S.nodes[p].parent}});return h}
function prog(id){var l=subtree(id).slice(1);return[l.filter(function(i){return S.nodes[i].done}).length,l.length]}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function fmt(t){return new Date(t+'T00:00').toLocaleDateString(undefined,{day:'numeric',month:'short'})}
function applyView(){var v=S.view;world.style.transform='translate('+v.x+'px,'+v.y+'px) scale('+v.k+')'}
function center(id){var n=S.nodes[id],e=el(id);return[n.x+(e?e.offsetWidth:80)/2,n.y+(e?e.offsetHeight:36)/2]}
function lines(){
  var h='';
  Object.values(S.nodes).forEach(function(n){
    if(!n.parent||!S.nodes[n.parent]||!el(n.id)||!el(n.parent))return;
    var a=center(n.parent),b=center(n.id),mx=(a[0]+b[0])/2;
    h+='<path d="M'+a[0]+','+a[1]+' C'+mx+','+a[1]+' '+mx+','+b[1]+' '+b[0]+','+b[1]+'" stroke="'+COLORS[n.color]+'"/>';
  });
  svg.innerHTML=h;
}
function render(){
  world.querySelectorAll('.n').forEach(function(e){e.remove()});
  var hid=hidden(),td=today(),ql=q.toLowerCase();
  Object.values(S.nodes).forEach(function(n){
    if(hid[n.id])return;
    var e=document.createElement('div'),bd='',pg=prog(n.id);
    e.className='n'+(n.id===S.root?' root':'')+(n.done?' done':'')+(n.id===sel?' sel':'')+(ql&&(n.text+' '+(n.note||'')).toLowerCase().indexOf(ql)<0?' dim':'');
    if(n.pri)bd+='<i class="p p'+n.pri+'"></i>';
    if(n.due)bd+='<b class="'+(!n.done&&n.due<td?'late':'')+'">'+fmt(n.due)+'</b>';
    if(pg[1])bd+='<b>'+pg[0]+'/'+pg[1]+'</b>';
    if(n.collapsed&&pg[1])bd+='<b>+'+pg[1]+'</b>';
    if(n.note)bd+='<b>note</b>';
    e.innerHTML='<span class="t"></span>'+(bd?'<span class="b">'+bd+'</span>':'');
    e.firstChild.textContent=n.text;
    e.dataset.id=n.id;e.style.left=n.x+'px';e.style.top=n.y+'px';
    e.style.setProperty('--c',COLORS[n.color]);world.appendChild(e);
  });
  lines();applyView();syncPanel();
}
function syncPanel(){
  var n=sel&&S.nodes[sel],p=document.getElementById('panel');
  document.getElementById('bDone').textContent=n&&n.done?'Mark open':'Mark done';
  document.getElementById('bCol').textContent=n&&n.collapsed?'Expand':'Collapse';
  p.hidden=!n;if(!n)return;
  document.getElementById('pDue').value=n.due||'';document.getElementById('pPri').value=n.pri||0;
  var nt=document.getElementById('pNote');if(document.activeElement!==nt)nt.value=n.note||'';
}
function select(id){sel=id;render()}

function addNode(parentId,text){
  var p=S.nodes[parentId],id=uid(),sib=kids(parentId);p.collapsed=false;
  var y=sib.length?Math.max.apply(null,sib.map(function(c){return c.y}))+62:p.y;
  var color=parentId===S.root?(sib.length+1)%COLORS.length:p.color;
  S.nodes[id]={id:id,text:text||'New idea',x:p.x+(el(parentId)?el(parentId).offsetWidth:100)+90,y:y,parent:parentId,color:color,done:false};
  sel=id;render();save();startEdit(id,true);
}
function addChild(){if(sel)addNode(sel)}
function addSibling(){if(!sel)return;var n=S.nodes[sel];addNode(n.parent||sel)}
function ask(msg,label,go){
  var o=document.createElement('div');
  o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:9';
  o.innerHTML='<div role="alertdialog" style="background:var(--bar);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:320px"><p style="margin:0 0 14px"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button class="x">Cancel</button><button class="y" style="background:var(--ink);color:var(--bg)"></button></div></div>';
  o.querySelector('p').textContent=msg;o.querySelector('.y').textContent=label;
  function close(){o.remove()}
  o.querySelector('.x').onclick=close;o.onclick=function(e){if(e.target===o)close()};
  o.querySelector('.y').onclick=function(){close();go()};
  document.body.appendChild(o);o.querySelector('.x').focus();
}
function del(){
  if(!sel||sel===S.root)return;
  var ids=subtree(sel),p=S.nodes[sel].parent;
  function go(){ids.forEach(function(i){delete S.nodes[i]});sel=p;render();save()}
  if(ids.length>1)ask('Delete this idea and its '+(ids.length-1)+' sub-ideas?','Delete',go);else go();
}
function toggleDone(){if(!sel)return;S.nodes[sel].done=!S.nodes[sel].done;render();save()}
function setColor(i){if(!sel)return;subtree(sel).forEach(function(id){S.nodes[id].color=i});render();save()}

function startEdit(id,selectAll){
  var e=el(id);if(!e)return;e=e.querySelector('.t');var old=S.nodes[id].text,done=false;editing=true;
  e.contentEditable='true';e.focus();
  var r=document.createRange();r.selectNodeContents(e);var s=getSelection();s.removeAllRanges();s.addRange(r);
  function finish(cancel){if(done)return;done=true;editing=false;
    var t=cancel?old:(e.textContent.trim()||'Untitled');S.nodes[id].text=t;render();save();}
  e.onblur=function(){finish(false)};
  e.onkeydown=function(ev){
    if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();finish(false)}
    else if(ev.key==='Escape'){ev.preventDefault();finish(true)}
    ev.stopPropagation();
  };
}

function tidy(nofit){
  var row=0,GAP=64,DX=60;
  function place(id,x){
    var e=el(id),n=S.nodes[id],c=n.collapsed?[]:kids(id).sort(function(a,b){return a.y-b.y});n.x=x;
    var w=e?e.offsetWidth:100;
    if(!c.length){n.y=row*GAP;row++;return}
    c.forEach(function(k){place(k.id,x+w+DX)});
    n.y=(S.nodes[c[0].id].y+S.nodes[c[c.length-1].id].y)/2;
  }
  place(S.root,0);render();save();if(!nofit)fit();
}
function fit(){
  var ns=Object.values(S.nodes),x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  ns.forEach(function(n){var e=el(n.id);if(!e)return;var w=e.offsetWidth,h=e.offsetHeight;
    x0=Math.min(x0,n.x);y0=Math.min(y0,n.y);x1=Math.max(x1,n.x+w);y1=Math.max(y1,n.y+h)});
  var W=innerWidth-80,H=innerHeight-170,k=Math.min(1.2,W/(x1-x0||1),H/(y1-y0||1));
  S.view={k:k,x:(innerWidth-(x1-x0)*k)/2-x0*k,y:(innerHeight-(y1-y0)*k)/2-y0*k+20};
  applyView();save();
}

/* pointer: pan, drag branch, select */
stage.addEventListener('pointerdown',function(e){
  if(editing)return;
  var t=e.target.closest('.n');
  if(t){select(t.dataset.id);
    drag={type:'node',id:t.dataset.id,sx:e.clientX,sy:e.clientY,moved:false,ids:subtree(t.dataset.id),o:{}};
    drag.ids.forEach(function(i){drag.o[i]=[S.nodes[i].x,S.nodes[i].y]});
  }else{drag={type:'pan',sx:e.clientX,sy:e.clientY,vx:S.view.x,vy:S.view.y};stage.classList.add('pan');
    if(sel){sel=null;render()}}
});
window.addEventListener('pointermove',function(e){
  if(!drag)return;var dx=e.clientX-drag.sx,dy=e.clientY-drag.sy;
  if(drag.type==='pan'){S.view.x=drag.vx+dx;S.view.y=drag.vy+dy;applyView()}
  else{if(!drag.moved&&Math.abs(dx)+Math.abs(dy)<4)return;drag.moved=true;
    drag.ids.forEach(function(i){var n=S.nodes[i];n.x=drag.o[i][0]+dx/S.view.k;n.y=drag.o[i][1]+dy/S.view.k;
      var q=el(i);q.style.left=n.x+'px';q.style.top=n.y+'px'});lines()}
});
window.addEventListener('pointerup',function(){if(drag){if(drag.type==='node'&&drag.moved||drag.type==='pan')save();drag=null;stage.classList.remove('pan')}});
stage.addEventListener('dblclick',function(e){var t=e.target.closest('.n');if(t){select(t.dataset.id);startEdit(t.dataset.id)}});
stage.addEventListener('wheel',function(e){
  e.preventDefault();var v=S.view,k=Math.min(2.5,Math.max(.25,v.k*(e.deltaY<0?1.1:.9)));
  v.x=e.clientX-(e.clientX-v.x)*k/v.k;v.y=e.clientY-(e.clientY-v.y)*k/v.k;v.k=k;applyView();save();
},{passive:false});

window.addEventListener('keydown',function(e){
  if(editing||document.body.classList.contains('locked')||document.body.classList.contains('notes')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||document.querySelector('[role=alertdialog]'))return;
  var k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&(k==='z'||k==='y')){e.preventDefault();(k==='y'||e.shiftKey)?redo():undo();return}
  if(k==='c'&&!e.ctrlKey&&!e.metaKey){toggleCol();return}
  if(e.key==='Tab'){e.preventDefault();addChild()}
  else if(e.key==='Enter'){e.preventDefault();addSibling()}
  else if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();del()}
  else if(e.key==='F2'){e.preventDefault();if(sel)startEdit(sel)}
  else if(e.key===' '){e.preventDefault();toggleDone()}
});

/* toolbar */
var sws=document.getElementById('sws');
COLORS.forEach(function(c,i){var b=document.createElement('button');b.className='sw';b.style.background=c;b.title='Colour this branch';b.setAttribute('aria-label','Colour '+(i+1));b.onclick=function(){setColor(i)};sws.appendChild(b)});
document.getElementById('bChild').onclick=addChild;
document.getElementById('bSib').onclick=addSibling;
document.getElementById('bEdit').onclick=function(){if(sel)startEdit(sel)};
document.getElementById('bDone').onclick=toggleDone;
document.getElementById('bDel').onclick=del;
document.getElementById('bTidy').onclick=function(){tidy()};
document.getElementById('bFit').onclick=fit;
function download(name,text,type){var bl=new Blob([text],{type:type}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
document.getElementById('bExp').onclick=function(){download('mind-map.json',JSON.stringify(S,null,2),'application/json');toast('Map saved to a file (not encrypted)')};
var file=document.getElementById('file');
document.getElementById('bImp').onclick=function(){file.click()};
file.onchange=function(){
  var f=file.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d.nodes||!d.nodes[d.root])throw 0;S=d;sel=null;render();save();fit()}catch(e){toast('That file is not a mind map')}};
  r.readAsText(f);file.value='';
};
document.getElementById('bNew').onclick=function(){
  ask('Start a new map? Save a file first if you want to keep this one.','Start new map',function(){S=fresh();sel=S.root;render();save();setTimeout(function(){startEdit(S.root)},50)});
};

function toggleCol(){var n=sel&&S.nodes[sel];if(!n||!kids(sel).length)return;n.collapsed=!n.collapsed;render();tidy(true)}
document.getElementById('bCol').onclick=toggleCol;
document.getElementById('bUndo').onclick=undo;
document.getElementById('bRedo').onclick=redo;
document.getElementById('q').oninput=function(){q=this.value.trim();render()};
function upd(k,v){if(sel&&S.nodes[sel]){S.nodes[sel][k]=v;save()}}
document.getElementById('pDue').onchange=function(){upd('due',this.value);render()};
document.getElementById('pPri').onchange=function(){upd('pri',+this.value);render()};
var pn=document.getElementById('pNote');
pn.oninput=function(){if(sel){S.nodes[sel].note=pn.value;persist()}};
pn.onchange=function(){save();render()};
document.getElementById('bCopy').onclick=function(){
  var out=[];(function w(id,d){var n=S.nodes[id];
    out.push('  '.repeat(d)+'- ['+(n.done?'x':' ')+'] '+n.text+(n.due?' (due '+n.due+')':'')+(n.pri?' [priority '+['','low','medium','high'][n.pri]+']':''));
    kids(id).sort(function(a,b){return a.y-b.y}).forEach(function(c){w(c.id,d+1)})})(S.root,0);
  var t=document.createElement('textarea');t.value=out.join('\n');document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Outline copied. Paste it anywhere');
};

/* tabs, notes */
function setTab(n){document.body.classList.toggle('notes',n==='notes');
  document.getElementById('tMap').setAttribute('aria-selected',n==='map');
  document.getElementById('tNotes').setAttribute('aria-selected',n==='notes');
  if(n==='map'&&S)render()}
function noteCount(){var c=0;STEPS.forEach(function(s,i){if((NOTES[i+1]||'').trim())c++});
  document.getElementById('ncount').textContent=c+' of '+STEPS.length+' steps have notes'}
function buildNotes(){var w=document.getElementById('cards');w.innerHTML='';
  STEPS.forEach(function(s,i){var c=document.createElement('section'),k=i+1;
    c.className='card'+((NOTES[k]||'').trim()?' has':'');c.style.setProperty('--c',COLORS[(i+1)%COLORS.length]);
    c.innerHTML='<h3><span></span><b></b></h3><p class="qq"></p><textarea placeholder="Write your notes for this step"></textarea>';
    c.querySelector('span').textContent=k;c.querySelector('b').textContent=s[0];c.querySelector('.qq').textContent=s[1];
    var ta=c.querySelector('textarea');ta.value=NOTES[k]||'';ta.setAttribute('aria-label',s[0]+' notes');
    ta.oninput=function(){NOTES[k]=ta.value;c.classList.toggle('has',!!ta.value.trim());noteCount();persist()};
    w.appendChild(c)});
  noteCount()}
document.getElementById('tMap').onclick=function(){setTab('map')};
document.getElementById('tNotes').onclick=function(){setTab('notes')};
document.getElementById('bNCopy').onclick=function(){
  var out=STEPS.map(function(s,i){return (i+1)+'. '+s[0]+' - '+s[1]+'\n'+((NOTES[i+1]||'').trim()||'(no notes yet)')}).join('\n\n');
  var t=document.createElement('textarea');t.value=out;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();toast('Notes copied. Paste them anywhere')};

/* login */
var A=document.getElementById('auth'),af=document.getElementById('af'),a1=document.getElementById('a1'),a2=document.getElementById('a2'),aE=document.getElementById('aE'),aGo=document.getElementById('aGo'),aX=document.getElementById('aX'),aReset=document.getElementById('aReset');
var T={unlock:['Unlock your planner','Enter your password to open your mind map and notes.','Unlock'],
  setup:['Create a password','Choose a password with 8 or more characters. Your data is encrypted with it, and it cannot be recovered if you forget it.','Create and open'],
  change:['Change password','Choose a new password. Save HTML again afterwards so the file on GitHub uses it too.','Change password']};
function showAuth(m){amode=m;A.classList.add('show');
  document.getElementById('aT').textContent=T[m][0];document.getElementById('aP').textContent=T[m][1];aGo.textContent=T[m][2];
  a2.hidden=m==='unlock';aX.hidden=m!=='change';aReset.hidden=m!=='unlock';a1.value='';a2.value='';aE.textContent='';aGo.disabled=false;
  a1.setAttribute('autocomplete',m==='unlock'?'current-password':'new-password');a1.focus()}
function enterApp(isNew){A.classList.remove('show');document.body.classList.remove('locked');
  sel=S.root;hist=[snapStr()];hi=0;buildNotes();setTab('map');if(isNew)tidy()}
function lock(){flush().then(function(){CK=null;SALT=null;S=null;NOTES={};
  world.querySelectorAll('.n').forEach(function(e){e.remove()});document.body.classList.add('locked');showAuth('unlock')})}
function unlockWith(pw){var c=[localVault(),EMB].filter(Boolean);
  return Promise.all(c.map(function(v){return openVault(v,pw).then(function(r){return r},function(){return null})})).then(function(rs){
    rs=rs.filter(function(r){return r&&r.payload&&r.payload.map&&r.payload.map.nodes});if(!rs.length)return null;
    rs.sort(function(a,b){return b.ts-a.ts});return rs[0]})}
af.onsubmit=function(ev){ev.preventDefault();var pw=a1.value;aE.textContent='';
  if(amode==='unlock'){aGo.disabled=true;aGo.textContent='Unlocking...';
    unlockWith(pw).then(function(r){
      if(!r){aE.textContent='That password is not right.';aGo.disabled=false;aGo.textContent=T.unlock[2];a1.select();return}
      CK=r.key;SALT=r.salt;S=r.payload.map;NOTES=r.payload.notes||{};enterApp(false)
    },function(){aE.textContent='Could not unlock. Try again.';aGo.disabled=false;aGo.textContent=T.unlock[2]});return}
  if(pw.length<8){aE.textContent='Use at least 8 characters.';return}
  if(pw!==a2.value){aE.textContent='The two passwords do not match.';return}
  aGo.disabled=true;var salt=crypto.getRandomValues(new Uint8Array(16));
  derive(pw,salt).then(function(k){CK=k;SALT=salt;
    if(amode==='setup'){var o=oldMap();migrated=!!o;S=o||fresh();NOTES={};
      return flush().then(function(){enterApp(!o);if(o)toast('Your earlier map was imported and locked')})}
    return flush().then(function(){A.classList.remove('show');toast('Password changed. Save HTML to update the file')})
  }).catch(function(){aE.textContent='Could not set the password. Try again.';aGo.disabled=false});
};
aX.onclick=function(){A.classList.remove('show')};
aReset.onclick=function(){ask('Erase the data saved in this browser and start over? A copy inside the HTML file stays until you save a new one.','Erase and start over',function(){
  try{localStorage.removeItem(LK)}catch(e){}EMB=null;showAuth('setup')})};
document.getElementById('bLock').onclick=lock;
document.getElementById('bPw').onclick=function(){showAuth('change')};
document.getElementById('bHtml').onclick=function(){flush().then(function(v){if(!v)return;
  var html=SRC.replace(/(<script id="vault" type="application\/json">)[\s\S]*?(<\/script>)/,function(m,x,y){return x+JSON.stringify(v)+y});
  if(html===SRC&&!EMB){toast('Could not build the file');return}
  download('Mind_map_planner.html',html,'text/html');toast('Saved. Upload this file to GitHub')})};
document.addEventListener('visibilitychange',function(){if(document.hidden)flush()});

if(!(window.crypto&&crypto.subtle)){showAuth('setup');aE.textContent='Encryption is not available here. Open this page over https or from a local file in a current browser.';aGo.disabled=true;a1.disabled=true;a2.disabled=true}
else showAuth((localVault()||EMB)?'unlock':'setup');
})();
</script>
</body>
